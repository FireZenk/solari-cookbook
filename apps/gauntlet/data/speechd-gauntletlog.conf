# speech-dispatcher output module that writes utterances to a file instead of
# speaking them. Uploaded to /etc/speech-dispatcher/modules/ on the desktop VM.
#
# sd_generic runs GenericExecuteSynth as a shell command per utterance and
# substitutes $DATA with the text. Pointing that at a log file turns the screen
# reader's speech stream into something you can read, diff and attach to a
# report — no audio capture, no transcription, exactly the words Orca chose.
GenericExecuteSynth "printf '%s\n' \"$DATA\" >> /tmp/gauntlet-speech.log"
GenericCmdDependency "printf"
GenericDelimiters " " "." ","
GenericPunctNone ""
GenericPunctSome ""
GenericPunctAll ""
GenericStripPunctChars ""
GenericLanguage "en" "en" "utf-8"
AddVoice "en" "MALE1" "en"
DefaultVoice "MALE1"
